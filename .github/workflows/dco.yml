name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-sign-off:
    name: Check Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full history to enumerate base..head.
          fetch-depth: 0

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue

            subject="$(git show -s --format='%s' "$sha")"

            if git show -s --format='%B' "$sha" \
                 | grep -qiE '^Signed-off-by: .+ <.+@.+>[[:space:]]*$'; then
              continue
            fi

            echo "::error::Missing Signed-off-by on ${sha:0:8} - ${subject}"
            missing=$((missing + 1))
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "${missing} commit(s) are missing a Signed-off-by line."
            echo ""
            echo "engzero uses the Developer Certificate of Origin (see ./DCO)."
            echo "Sign off by amending or rebasing, then force-push:"
            echo ""
            echo "    git commit --amend -s --no-edit     # last commit only"
            echo "    git rebase --signoff origin/main    # whole branch"
            echo ""
            exit 1
          fi

          echo "All commits carry a Signed-off-by line."
